# Test runtime only. Always use project order-show-load-lottery and port 8680.
services:
  backend:
    image: eclipse-temurin:21-jre
    entrypoint: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ${LOTTERY_BENCH_JAR:?provide an isolated benchmark jar}:/app/app.jar:ro
    environment:
      SPRING_FLYWAY_USER: root
      SPRING_FLYWAY_PASSWORD: load_only_root
      LOTTERY_PREVIEW_CONCURRENCY: "2"
      LOTTERY_DRAW_CONCURRENCY: "1"
      LOTTERY_QUERY_TIMEOUT_SECONDS: "8"
