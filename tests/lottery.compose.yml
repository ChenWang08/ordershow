name: order-show-lottery-test
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_show_lottery_test
      MYSQL_ROOT_PASSWORD: lottery_only_root
    ports: ["127.0.0.1:33316:3306"]
    tmpfs: ["/var/lib/mysql"]
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40
