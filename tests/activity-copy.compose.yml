name: order-show-activity-copy-test
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_show_activity_copy_test
      MYSQL_ROOT_PASSWORD: copy_only_root
    ports: ["127.0.0.1:33353:3306"]
    tmpfs: ["/var/lib/mysql"]
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: copy_only_test
      MINIO_ROOT_PASSWORD: copy_only_test_secret
    ports: ["127.0.0.1:39153:9000"]
    tmpfs: ["/data"]
    mem_limit: 384m
    cpus: 1
