# Activated by test/prod profile groups. No local credentials or schema mutation.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
order-show:
  # Per-instance identity caches cannot immediately observe another replica's revocation.
  # Keep shared database authority by default; this is NOT the dashboard summary switch.
  h5-session-cache-ttl-ms: 0
  bootstrap-enabled: false
  legacy-migration-enabled: false
  price-backfill-enabled: false
  cookie-secure: true
  public-origin: ${PUBLIC_ORIGIN}
  phone-hmac-key: ${PHONE_HMAC_KEY}
  phone-encryption-key: ${PHONE_ENCRYPTION_KEY}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    bucket: ${STORAGE_BUCKET}
