server:
  shutdown: graceful
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${HTTP_MAX_THREADS:40}
  servlet:
    context-path: /api/v1
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 45s
  profiles:
    group:
      test: cloud
      prod: cloud
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  application:
    name: order-show-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_show?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:order_show}
    password: ${DB_PASSWORD:order_show_local}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      maximum-pool-size: ${DB_POOL_SIZE:60}
      minimum-idle: ${DB_POOL_MIN_IDLE:30}
      connection-timeout: 5000
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
        preserveInstants: true
        rewriteBatchedStatements: true
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
  flyway:
    enabled: ${DB_MIGRATION_ENABLED:true}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:order_show}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:order_show_local}}
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 170MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

order-show:
  dashboard:
    summary-enabled: ${DASHBOARD_SUMMARY_ENABLED:false}
    summary-activities: ${DASHBOARD_SUMMARY_ACTIVITIES:}
  public-origin: ${PUBLIC_ORIGIN:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  admin-session-hours: ${ADMIN_SESSION_HOURS:12}
  h5-session-hours: ${H5_SESSION_HOURS:12}
  phone-hmac-key: ${PHONE_HMAC_KEY:local-only-change-this-phone-hmac-key}
  phone-encryption-key: ${PHONE_ENCRYPTION_KEY:local-only-change-this-32-byte-key}
  bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
  bootstrap-admin-display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
  storage:
    endpoint: ${STORAGE_ENDPOINT:${S3_ENDPOINT:http://localhost:9000}}
    access-key: ${STORAGE_ACCESS_KEY:${S3_ACCESS_KEY:order_show_minio}}
    secret-key: ${STORAGE_SECRET_KEY:${S3_SECRET_KEY:order_show_minio_2026}}
    bucket: ${STORAGE_BUCKET:${S3_BUCKET:order-show}}

logging:
  level:
    root: INFO
    com.fengyi.ordershow: INFO
