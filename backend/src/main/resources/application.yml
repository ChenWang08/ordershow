server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  forward-headers-strategy: framework

spring:
  application:
    name: order-show-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_show?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:order_show}
    password: ${DB_PASSWORD:order_show_local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 170MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

order-show:
  public-origin: ${PUBLIC_ORIGIN:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  admin-session-hours: ${ADMIN_SESSION_HOURS:12}
  h5-session-hours: ${H5_SESSION_HOURS:12}
  phone-hmac-key: ${PHONE_HMAC_KEY:local-only-change-this-phone-hmac-key}
  phone-encryption-key: ${PHONE_ENCRYPTION_KEY:local-only-change-this-32-byte-key}
  bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
  bootstrap-admin-display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:order_show_minio}
    secret-key: ${S3_SECRET_KEY:order_show_minio_2026}
    bucket: ${S3_BUCKET:order-show}

logging:
  level:
    root: INFO
    com.fengyi.ordershow: INFO
