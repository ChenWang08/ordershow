apiVersion: v1
kind: ConfigMap
metadata:
  name: order-show-config
data:
  SPRING_PROFILES_ACTIVE: test
  DB_MIGRATION_ENABLED: "false"
  # Preserve UTC connection settings; do not override Hikari UTC initialization.
  DB_URL: "jdbc:mysql://REPLACE_ME:3306/order_show?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&sslMode=VERIFY_IDENTITY"
  DB_USERNAME: "REPLACE_ME"
  DB_POOL_SIZE: "10"
  DB_POOL_MIN_IDLE: "2"
  H5_SESSION_CACHE_TTL_MS: "0"
  # Existing databases require DBA migration to V049 and summary, repair and check before this is enabled.
  DASHBOARD_SUMMARY_ENABLED: "true"
  DASHBOARD_SUMMARY_ACTIVITIES: ""
  REDIS_HOST: "REPLACE_ME"
  REDIS_PORT: "6379"
  REDIS_USERNAME: ""
  REDIS_SSL_ENABLED: "true"
  STORAGE_PROVIDER: oss
  STORAGE_ENDPOINT: "https://REPLACE_ME"
  STORAGE_BUCKET: "REPLACE_ME"
  OSS_REGION: "REPLACE_ME"
  PUBLIC_ORIGIN: "https://REPLACE_ME"
  REALTIME_CHANNEL: "order-show:test:events"
  H5_WARMUP_ENABLED: "true"
  H5_WRITE_CONCURRENCY: "12"
  HTTP_MAX_THREADS: "40"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
  ACTIVITY_INFO_CHANNEL: "order-show:test:events:activity-info:v1"
  H5_CATALOG_CHANNEL: "order-show:test:events:product-catalog:v1"
  ACTIVITY_INFO_HEARTBEAT_MS: "30000"
  ACTIVITY_INFO_MAX_CONNECTIONS: "2000"
  H5_CATALOG_CACHE_ENABLED: "true"
  H5_CATALOG_MAX_ACTIVITIES: "32"
  H5_CATALOG_MAX_BYTES: "33554432"
  H5_CATALOG_IDLE_SECONDS: "600"
  H5_CATALOG_MAX_LOADS: "4"
  H5_CATALOG_MAX_WAITERS: "128"
  H5_CATALOG_WAIT_MILLIS: "5000"
  LOTTERY_PREVIEW_CONCURRENCY: "2"
  LOTTERY_DRAW_CONCURRENCY: "1"
  LOTTERY_QUERY_TIMEOUT_SECONDS: "8"
