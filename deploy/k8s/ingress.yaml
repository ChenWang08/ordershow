# Standard Ingress. Operations supplies controller-specific annotations.
# Public /api/v1/public/activities/{code}/events requires streaming: buffering/cache off,
# idle/read timeout >= 90 seconds for the default 30-second heartbeat; preserve /api/v1.
# Verify these settings on the actual ACK NGINX/ALB controller before rollout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-show
spec:
  ingressClassName: REPLACE_ME
  tls:
    - hosts: [orders.example.com]
      secretName: order-show-tls
  rules:
    - host: orders.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port: {number: 8080}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 3000}
