apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 4
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: order-show-backend}
  template:
    metadata:
      labels: {app: order-show-backend}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 70
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: backend
          image: registry.example.com/order-show/backend:REPLACE_ME
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: order-show-config}
            - secretRef: {name: order-show-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep 10"]
          startupProbe:
            httpGet: {path: /api/v1/actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/v1/actuator/health/readiness, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/v1/actuator/health/liveness, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: order-show-backend}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: order-show-frontend}
  template:
    metadata:
      labels: {app: order-show-frontend}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: frontend
          image: registry.example.com/order-show/frontend:REPLACE_ME
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: PORT, value: "3000"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep 10"]
          startupProbe:
            httpGet: {path: /admin, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /admin, port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: order-show-frontend}
  ports:
    - {name: http, port: 3000, targetPort: http}
