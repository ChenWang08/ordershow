# Local Docker entry: the browser uses one origin for pages, APIs and images.
# Resolve service names again when Compose recreates an upstream container.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream order_show_frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

upstream order_show_backend {
    zone backend 64k;
    server backend:8080 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Match the backend's existing multipart request limit.
    client_max_body_size 170m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /api/v1/ {
        # Stream imports, exports and files; pass cookies, ETag, 304 and cache headers through.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://order_show_backend;
    }

    location / {
        proxy_buffering off;
        proxy_pass http://order_show_frontend;
    }
}
