# Disposable stack: no production URLs, named volumes or business ports.
# MySQL uses an anonymous disk volume (removed with down -v), not unbounded tmpfs.
name: order-show-ack-smoke
x-backend-env: &backend-env
  DB_URL: jdbc:mysql://mysql:3306/ack_smoke?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  DB_POOL_SIZE: "20"
  DB_POOL_MIN_IDLE: "2"
  H5_SESSION_CACHE_TTL_MS: "0"
  H5_WRITE_MAX_WAITERS: "50"
  H5_CUSTOMER_WRITE_RATE_LIMIT_ENABLED: "true"
  PHONE_HMAC_KEY: e2e-only-phone-hmac-key-never-use-in-business
  PHONE_ENCRYPTION_KEY: e2e-only-encryption-key-never-use-in-business
  ACTIVITY_HTTP_REVISION_TTL_MS: "2000"
  ACTIVITY_HTTP_MAX_ACTIVITIES: "64"
  ACTIVITY_HTTP_MAX_LOADS: "2"
  ACTIVITY_HTTP_MAX_WAITERS: "128"
  ACTIVITY_HTTP_WAIT_MS: "3000"
  DASHBOARD_SUMMARY_ENABLED: "true"
  HTTP_MAX_THREADS: "40"
  H5_WRITE_CONCURRENCY: "36"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
  DB_USERNAME: ack_smoke
  DB_PASSWORD: isolated_smoke_password
  DB_MIGRATION_ENABLED: "false"
  REDIS_HOST: redis
  REALTIME_CHANNEL: order-show:ack-smoke:events
  H5_CATALOG_MAX_LOADS: "4"
  H5_CATALOG_MAX_WAITERS: "128"
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: smoke_minio
  S3_SECRET_KEY: isolated_smoke_minio_password
  S3_BUCKET: ack-smoke
  BOOTSTRAP_ADMIN_USERNAME: smoke_admin
  BOOTSTRAP_ADMIN_PASSWORD: SmokeInitial123!
  H5_WARMUP_ENABLED: "false"
services:
  mysql:
    image: mysql:8.4
    mem_limit: 768m
    cpus: 2
    ports: ["127.0.0.1:18306:3306"]
    command: ["--default-time-zone=+08:00", "--innodb-buffer-pool-size=268435456"]
    environment:
      MYSQL_DATABASE: ack_smoke
      MYSQL_USER: ack_smoke
      MYSQL_PASSWORD: isolated_smoke_password
      MYSQL_ROOT_PASSWORD: isolated_smoke_root
    volumes:
      - /var/lib/mysql
      - ../dba/generated/fresh-install.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysql -uack_smoke ack_smoke -e 'SELECT version FROM deployment_schema_history' >/dev/null 2>&1"]
      interval: 3s
      retries: 60
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    tmpfs: [/data]
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: smoke_minio
      MINIO_ROOT_PASSWORD: isolated_smoke_minio_password
    tmpfs: [/data]
  backend-a:
    image: order-show-ack-backend:${ACK_IMAGE_TAG:-20261105.1}
    mem_limit: 768m
    cpus: 2
    environment: *backend-env
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
  backend-b:
    image: order-show-ack-backend:${ACK_IMAGE_TAG:-20261105.1}
    mem_limit: 768m
    cpus: 2
    environment:
      <<: *backend-env
      ORDER_SHOW_BOOTSTRAP_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Shanghai -XX:MaxRAMPercentage=60"
    ports: ["127.0.0.1:18082:8080"]
    depends_on:
      backend-a: {condition: service_healthy}
  backend-c:
    image: order-show-ack-backend:${ACK_IMAGE_TAG:-20261105.1}
    mem_limit: 768m
    cpus: 2
    environment:
      <<: *backend-env
      ORDER_SHOW_BOOTSTRAP_ENABLED: "false"
    ports: ["127.0.0.1:18084:8080"]
    depends_on:
      backend-a: {condition: service_healthy}
  backend-d:
    image: order-show-ack-backend:${ACK_IMAGE_TAG:-20261105.1}
    mem_limit: 768m
    cpus: 2
    environment:
      <<: *backend-env
      ORDER_SHOW_BOOTSTRAP_ENABLED: "false"
    ports: ["127.0.0.1:18085:8080"]
    depends_on:
      backend-a: {condition: service_healthy}
  export-worker:
    image: order-show-ack-backend:${ACK_IMAGE_TAG:-20261105.1}
    command: ["--export-worker"]
    read_only: true
    mem_limit: 512m
    cpus: 0.5
    volumes: [/tmp]
    environment:
      <<: *backend-env
      SPRING_MAIN_KEEP_ALIVE: "true"
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:ActiveProcessorCount=1"
      ORDER_SHOW_EXPORT_TEMP_DIR: /tmp/order-exports
    healthcheck: {disable: true}
    depends_on:
      backend-a: {condition: service_healthy}
  gateway:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:18031:80"]
    volumes: ["./nginx-smoke.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend-a: {condition: service_healthy}
      backend-b: {condition: service_healthy}
      backend-c: {condition: service_healthy}
      backend-d: {condition: service_healthy}
      frontend: {condition: service_started}
  frontend:
    image: order-show-ack-frontend:${ACK_IMAGE_TAG:-20261105.1}
    ports: ["127.0.0.1:18030:3000"]
  redis-cloud-check:
    profiles: [cloud-check]
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no", --requirepass, isolated_cloud_redis]
    tmpfs: [/data]
  cloud-check:
    profiles: [cloud-check]
    image: order-show-ack-backend:${ACK_IMAGE_TAG:-20261105.1}
    mem_limit: 768m
    cpus: 2
    ports: ["127.0.0.1:18083:8080"]
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: test
      REDIS_HOST: redis-cloud-check
      REDIS_PASSWORD: isolated_cloud_redis
      REALTIME_CHANNEL: order-show:cloud-check:events
      STORAGE_PROVIDER: oss
      STORAGE_ENDPOINT: https://oss.invalid
      STORAGE_BUCKET: smoke-only
      STORAGE_ACCESS_KEY: dummy-smoke-ak
      STORAGE_SECRET_KEY: dummy-smoke-sk
      OSS_REGION: cn-hangzhou
      PUBLIC_ORIGIN: https://smoke.invalid
      PHONE_HMAC_KEY: smoke-hmac-only-not-production-0123456789
      PHONE_ENCRYPTION_KEY: smoke-encryption-only-not-production-0123456789
    depends_on:
      mysql: {condition: service_healthy}
      redis-cloud-check: {condition: service_started}
