# Source-only verification; no application/ACK release image is built or deployed.
name: order-show-ack-smoke-lottery-review
services:
  mysql:
    image: mysql:8.4
    pull_policy: never
    environment:
      MYSQL_DATABASE: order_show_lottery_test
      MYSQL_ROOT_PASSWORD: lottery_only_root
    ports: ["127.0.0.1:33316:3306"]
    volumes: [/var/lib/mysql]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 2s
      retries: 40
  tests:
    image: maven:3.9.11-eclipse-temurin-21
    pull_policy: never
    working_dir: /workspace
    environment:
      ORDER_SHOW_LOTTERY_TEST: order-show-lottery-test
      ORDER_SHOW_REVIEW_TEST: order-show-ack-smoke-lottery-review
      MAVEN_OPTS: -Xmx256m
    volumes:
      - ../..:/workspace
      - maven-cache:/root/.m2
    mem_limit: 2g
    cpus: 2
    depends_on:
      mysql: {condition: service_healthy}
    command: [mvn, -o, -B, -ntp, -f, backend/pom.xml, "-DargLine=-Xmx512m", "-Dtest=ActivityWriteConfigurationTest,ActivityWriteHttpConcurrencyIntegrationTest,LotteryIntegrationTest,LotteryOrderTest,LotteryWeightingTest,LotteryQueryTimeoutTest,LotteryOrderHttpTest,OrderReviewConcurrencyIntegrationTest,OrderSubmitWritePathTest,OrderSubmissionReadReuseTest,PriceSyncServiceTest,TonnageSyncServiceTest", test]
volumes:
  maven-cache:
    external: true
    name: order-show-m2
