              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
    put:
      operationId: reorderLotteryRounds
      tags: [Lottery]
      summary: 调整未开始轮次的执行顺序，不改变配置、身份或历史结果
      description: 固定所有已开始轮次及其之前的位置；从未开奖的DRAFT/READY后缀可重排。版本一致的同序重放不重复写入；版本过期或锁忙立即409；不触发候选试算、统计查询或全活动通知。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - name: ruleId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, roundIds]
              properties:
                expectedRevision:
                  type: integer
                  minimum: 0
                roundIds:
                  type: array
                  description: 当前规则全部轮次ID，包含位置不变的固定前缀，不得遗漏或重复
                  items:
                    $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 已保存的最新轻量顺序和revision；相同顺序直接返回，不重复记录成功审计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
