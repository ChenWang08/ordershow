              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 兼容旧入口；已有订单的撤回需要改用订单变更申请，直接调用返回 ORDER_CHANGE_REVIEW_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrderResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /h5/activities/{activityCode}/order-change-requests:
    post:
      operationId: createH5OrderChangeRequest
      tags: [H5]
      summary: 提交已有订单的修改或撤回申请
      description: 首次下单、纯增量和撤回/作废后恢复使用订单 PUT 接口；有效订单减少任一商品、删除商品或整单撤回才创建待审核申请，审核前原订单不变。无减量的修改申请返回 ORDER_CHANGE_REVIEW_NOT_REQUIRED。
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, requestType, items]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                expectedLockVersion:
                  type: integer
                  minimum: 0
                  description: 当前订单锁版本；新客户端提交以防状态变化后误覆盖
                requestType:
                  type: string
                  enum: [MODIFY, WITHDRAW]
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/SubmitOrderItem'
                customerNote:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: 变更申请已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /h5/activities/{activityCode}/order-change-requests/current:
