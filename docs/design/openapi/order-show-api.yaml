        - name: activityId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: actionCode
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPageResponse'
  /screen/activities/{activityCode}/ranking:
    get:
      operationId: getRankingDashboard
      tags: [Dashboard]
      summary: 排行榜快照
      description: 独立四维组合排行；客户类型、大区、项目组单选，品种多选，各维度默认不限制。页面进入仅加载选项，确认后查询，手动刷新沿用最后成功条件及金额/吨数口径。商品条件匹配同一明细行，进行中活动按需汇总当前有效明细；无商品条件时保留原整单吨数汇总优化。总计覆盖全部命中订单，不受 TopN 限制。FINISHED 随订单维护更新，ARCHIVED 冻结。不计算 sku_count，productLines/latestOrders 兼容字段为空数组；订单看板 TOP15 仍由 /dashboard 查询。
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: customerType
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, SPECIAL, GENERAL]
          description: 客户类型筛选；ALL 表示不限制客户类型，包含综合、特渠及系统内代表空客户类型的 ALL 订单。
        - name: regionCode
          in: query
          required: false
          description: 实际大区编码，各客户类型均适用；省略表示全部，空大区使用 regionUnassigned。
          schema:
            type: string
        - name: regionUnassigned
          in: query
          description: 仅匹配未填写大区；不能与 regionCode 同传。
          schema: {type: boolean, default: false}
        - name: productLine
          in: query
          description: 实际项目组名；省略表示全部，不使用特殊名称代表空值。
          schema: {type: string, maxLength: 200}
        - name: productLineUnassigned
          in: query
          description: 仅匹配未填写项目组；不能与 productLine 同传。
          schema: {type: boolean, default: false}
        - name: varieties
          in: query
          description: 品种多选，重复参数传值；名称中的逗号保留原样，不按逗号拆分。省略且未选择空值时表示全部品种。
          style: form
          explode: true
          schema:
            type: array
            maxItems: 500
            items: {type: string, maxLength: 100}
        - name: includeUnspecifiedVariety
          in: query
          description: 同时包含未填写品种；可单独使用或与 varieties 组合。
          schema: {type: boolean, default: false}
        - name: metric
          in: query
          required: false
          description: 排行口径；AMOUNT 按订单金额排序，TONS 按可计算吨数排序；不传时默认为 AMOUNT。
          schema:
            type: string
            enum: [AMOUNT, TONS]
            default: AMOUNT
      responses:
        '200':
          description: 排行榜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: 筛选值不合法、互斥空值标志或品种数量超限。
        '409':
          description: RANKING_HISTORY_MISMATCH，保留订单与旧冻结结果不一致，需核查历史资料。
    post:
      operationId: queryRankingDashboard
      tags: [Dashboard]
      summary: 排行组合查询（较多品种）
      description: GET 的只读等价接口，不修改业务数据。前端在编码后的筛选串超过 6000 字符时使用，避免 URL 长度限制。
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerType: {type: string, enum: [ALL, GENERAL, SPECIAL]}
                regionCode: {type: string, maxLength: 64}
                regionUnassigned: {type: boolean, default: false}
                productLine: {type: string, maxLength: 200}
                productLineUnassigned: {type: boolean, default: false}
                varieties:
                  type: array
                  maxItems: 500
                  items: {type: string, maxLength: 100}
                includeUnspecifiedVariety: {type: boolean, default: false}
                metric: {type: string, enum: [AMOUNT, TONS], default: AMOUNT}
      responses:
        '200':
          description: 与 GET 相同的金额/吨数排行和总计。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '400':
          description: 筛选值不合法。
        '409':
          description: 历史结果核对不一致。
  /screen/activities/{activityCode}/ranking/options:
    get:
      operationId: getRankingFilterOptions
      tags: [Dashboard]
      summary: 排行筛选实际选项
      description: 按客户类型和大区筛选适用商品维度。customers 保留完整客户类型/大区组合，前端按类型收窄大区；products 返回所选客户/大区范围的项目组/品种对，前端再按项目组联动品种。包含当前发布、适用但未订购的商品配置（遵守客户类型、分公司及经销商范围），以及有效订单实际维度。上游变化重置下游；默认全部，不自动统计金额、吨数或排行。空串、纯空格和 null 统一输出显式 null；实际名称“未填写”仍是普通值。新历史快照从冻结关联资料读取；旧历史首次确认并核对前暂读保留资料，已冻结但缺少关联资料时不可限定客户/大区。本轮不重写旧归档或修复旧历史核对错误。
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - in: query
          name: customerType
          schema: {type: string, enum: [ALL, GENERAL, SPECIAL]}
          description: 不传或 ALL 为全部客户，包含数据库中类型为 ALL 的不区分类型客户。
        - in: query
          name: regionCode
          schema: {type: string, maxLength: 64}
          description: 大区实际编号；与 regionUnassigned=true 互斥。
        - in: query
          name: regionUnassigned
          schema: {type: boolean, default: false}
          description: 只取大区未填写的客户，包含 null、空字符串及纯空格。
      responses:
        '200':
          description: 实际客户类型、大区和商品项目组/品种组合；不返回客户姓名、手机号。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customers:
                        type: array
                        items:
                          type: object
                          required: [customerType, regionCode, regionName]
                          properties:
                            customerType: {type: string, enum: [GENERAL, SPECIAL, ALL]}
                            regionCode: {type: [string, 'null']}
                            regionName: {type: string}
                      products:
                        type: array
                        items:
                          type: object
                          required: [productLine, varietyName]
                          properties:
                            productLine: {type: [string, 'null']}
                            varietyName: {type: [string, 'null']}
                  traceId: {type: string}
        '400':
          description: 筛选值不合法，或大区编号与未填写标记同时传入。
        '409':
          description: RANKING_OPTIONS_SCOPE_UNAVAILABLE；旧冻结快照没有联动资料，请使用全部客户、全部大区查看。不会改写归档。
  /screen/activities/{activityCode}/dashboard:
    get:
      operationId: getOrderDashboard
      tags: [Dashboard]
      summary: 订单综合看板快照
      description: 专用看板查询，保留总计、项目组、客户类型、大区、小时趋势与 TOP15。giftCustomerTypes/topGeneral/topSpecial/dashboard.latestOrders 兼容字段为空数组。
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 订单总览、渠道项目组对比、动态综合渠道片区项目组明细、排行和小时趋势；data.generalRegions 为自描述片区数组，空数组表示活动不分片区。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /screen/activities/{activityCode}/reports/{reportCode}:
    get:
      operationId: getTopicReport
      tags: [Dashboard]
      summary: 专题战报快照
      description: 一次返回全部九类专题所需数据，前端切换专题不重新请求。dashboard.totals 仅含 total_amount；dashboard.companies/dashboard.branches/dashboard.latestOrders/trend 兼容字段为空数组。不会计算完整排行榜、SKU 或趋势。
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: reportCode
          in: path
          required: true
          schema:
            type: string
            enum: [SPECIAL_TOP5, GENERAL_TOP5, OVERALL, CHANNEL_TOTALS, GENERAL_REGION_TOTALS, GIFT_BOX_TOTALS, GENERAL_PRODUCT_LINES, ALL_PRODUCT_LINES, GENERAL_REGION_AND_LINES]
      responses:
        '200':
          description: 战报通用表格/指标快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /screen/activities/{activityCode}/lottery:
    get:
      operationId: getLotteryScreenState
      tags: [Lottery]
      summary: 现场抽奖只读状态和已保存结果
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 抽奖状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'
  /screen/activities/{activityCode}/events:
    get:
      operationId: subscribeScreenEvents
      tags: [Dashboard]
      summary: 活动大屏 SSE 事件流
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: Last-Event-ID
          in: header
          description: 兼容接收但当前不提供事件续传；每次连接建立后应重新查询完整快照。
          schema:
            type: string
      responses:
        '200':
          description: connected/invalidate事件流。invalidate按活动合并，scope为ACTIVITY，eventCount为本批事件数，oldestEventAt为最早事件时间；version为本批最大ID而非可跳过迟提交事件的全局水位。eventType/aggregateId仅描述最后一条事件。客户端收到通知后刷新完整快照，允许重复通知。
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    h5Cookie:
      type: apiKey
      in: cookie
      name: ORDER_SHOW_H5_SESSION
      description: 默认同站点 H5 会话 Cookie；写请求还必须携带 X-CSRF-Token
    adminCookie:
      type: apiKey
      in: cookie
      name: ORDER_SHOW_ADMIN_SESSION
    screenToken:
      type: apiKey
      in: query
      name: screenToken
  parameters:
    ActivityCode:
      name: activityCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$'
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [20, 50, 100]
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        examples: ['"3"']
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IncludeOrderHistory:
      name: includeHistory
      in: query
      description: 默认兼容返回全部历史；false只读取当前订单，versions与operations返回空数组。不会删除历史，管理员历史接口不受影响。
      schema:
        type: boolean
        default: true
  responses:
    Problem:
      description: 统一错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MemberPermission:
      type: string
      enum: [OVERVIEW, PRODUCT, WHITELIST, ATTENDANCE, ORDER, LOTTERY]
      description: 六项独立模块权限；不包含活动生命周期或账号管理。
    DepartmentMember:
      type: object
      required: [id, username, displayName, departmentId, departmentName, status, lockVersion, permissions]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        departmentId: { type: integer, format: int64 }
        departmentName: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        lockVersion: { type: integer }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/MemberPermission' }
    MemberCreate:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        departmentId: { type: integer, format: int64, description: 超级管理员必填；部门管理员自动绑定本部门 }
        password: { type: string, format: password, minLength: 8, maxLength: 100, writeOnly: true }
        permissions:
          type: array
          uniqueItems: true
          default: []
          items: { $ref: '#/components/schemas/MemberPermission' }
    MemberUpdate:
      type: object
      required: [lockVersion]
      properties:
        lockVersion: { type: integer, description: 当前成员版本，避免覆盖其他管理员的修改 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        password: { type: string, format: password, minLength: 8, maxLength: 100, writeOnly: true }
        permissions:
          type: array
          uniqueItems: true
          description: 传入时整体替换权限，空数组收回全部权限，省略保留原权限
          items: { $ref: '#/components/schemas/MemberPermission' }
    MemberResponse:
      type: object
      required: [data, traceId]
      properties:
        data: { $ref: '#/components/schemas/DepartmentMember' }
        traceId: { type: string }
    Id:
      type: string
      pattern: '^[1-9][0-9]*$'
      examples: ['123']
    Decimal:
      type: string
      pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
      examples: ['19457005.28']
    CustomerType:
      type: string
      enum: [GENERAL, SPECIAL, ALL]
      description: 白名单/身份使用的客户类型；ALL 表示白名单不区分综合或特渠，客户可直接输入手机号。
    ProductCustomerType:
      type: string
      enum: [GENERAL, SPECIAL, ALL]
      description: 商品适用客户类型；ALL 表示不区分综合或特渠。
    RegionCode:
      type: string
      minLength: 1
      maxLength: 64
      description: 根据当前综合客户白名单中的大区名称自动生成或复用的稳定内部代码。
    RebateStatus:
      type: string
      enum: [PARTICIPATING, NOT_PARTICIPATING]
    ProductRebateStatus:
      type: string
      enum: [PARTICIPATING, NOT_PARTICIPATING, ALL]
      description: 商品返利类型；ALL 表示不区分是否返利。
    ActivityStatus:
      type: string
      enum: [DRAFT, SCHEDULED, ACTIVE, CLOSED, FINISHED, ARCHIVED]
      description: FINISHED 表示整场活动已结束；超级管理员可手动归档到 ARCHIVED，全部业务写入冻结，解除归档仅恢复 FINISHED。
    ActivityLifecycleReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ActivityDeletionPreview:
      type: object
      required: [activityId, code, name, departmentName, version, orders, products, customers, winners, files]
      properties:
        activityId: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        departmentName: { type: string }
        version: { type: integer }
        orders: { type: integer, format: int64 }
        products: { type: integer, format: int64 }
        customers: { type: integer, format: int64 }
        winners: { type: integer, format: int64 }
        files: { type: integer, format: int64 }
    ActivityCopyRequest:
      type: object
      required: [name, startsAt, endsAt, eventEndsAt, sourceId, sourceStamp, selection, requestKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        eventEndsAt: { type: string, format: date-time }
        departmentId: { type: integer, format: int64, description: 超级管理员必填，部门管理员使用自身部门 }
        sourceId: { type: integer, format: int64, minimum: 1 }
        sourceStamp: { type: string, minLength: 1 }
        selection:
          type: object
          description: 至少选择一项；所选模块在来源中必须有有效配置
          properties:
            products: { type: boolean, default: false }
            whitelist: { type: boolean, default: false }
            lottery: { type: boolean, default: false }
        requestKey: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
    ActivityCopyTask:
      type: object
      required: [id, status, stage, copiedFiles, totalFiles]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED, CANCELLED] }
        stage: { type: string, enum: [QUEUED, IMAGES, CONFIGURATION, COMPLETED] }
        copiedFiles: { type: integer }
        totalFiles: { type: integer }
        failureMessage: { type: string }
        activityId: { type: integer, format: int64 }
        activityCode: { type: string }
    ActivityCopyTaskResponse:
      type: object
      required: [data, traceId]
      properties:
        data: { $ref: '#/components/schemas/ActivityCopyTask' }
        traceId: { type: string }
    ActivityDeletionTask:
      type: object
      required: [id, activityId, activityCode, activityName, departmentName, requestedByName, reason, status, stage, stageName, deletedRows, deletedFiles, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        activityId: { type: integer, format: int64 }
        activityCode: { type: string }
        activityName: { type: string }
        departmentName: { type: string }
        requestedByName: { type: string }
        reason: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, FAILED, COMPLETED] }
        stage: { type: integer }
        stageName: { type: string }
        deletedRows: { type: integer, format: int64 }
        deletedFiles: { type: integer, format: int64 }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    ActivityDeletionTaskResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/ActivityDeletionTask'
        traceId: { type: string }
    OrderStatus:
      type: string
      enum: [SUBMITTED, WITHDRAWN, VOIDED]
    ImportType:
      type: string
      enum: [PRODUCT, WHITELIST, ATTENDANCE, PRODUCT_IMAGE]
    ImportStatus:
      type: string
      enum: [UPLOADED, PARSING, PREVIEW_READY, CONFIRMING, MATERIALIZING, READY_TO_PUBLISH, PUBLISHING, COMPLETED, FAILED, CANCELLED]
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    PageMeta:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    GenericPageResponse:
      type: object
      required: [data, page, traceId]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          $ref: '#/components/schemas/PageMeta'
        traceId:
          type: string
    GenericListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        traceId:
          type: string
    SingleObjectResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          description: 排行数据中的吨数按有效订单当前明细的非空 line_tons 汇总；部分明细缺少转换系数时仍返回可计算合计，全部不可计算时为 null。
          additionalProperties: true
        traceId:
          type: string
    PublicActivity:
      type: object
      required: [code, name, status, startsAt, endsAt, eventEndsAt, timezone, customerScope]
      properties:
        h5BackgroundUrl:
          type: [string, 'null']
          description: 手机入口背景的公开资源路径；未配置时省略，前端使用默认背景。
        desktopBackgroundUrl:
          type: [string, 'null']
          description: 三个电脑端展示页面共用的公开背景资源路径；未配置时省略。
        code:
          type: string
          description: 面向运营人员展示的活动编号，用于数据识别、报表和兼容旧链接。
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ActivityStatus'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: 订货截止时间
        eventEndsAt:
          type: string
          format: date-time
          description: 整场活动结束时间；到时停止抽奖，统计转为历史回看；独立活动资料 SSE 保留以感知重新开放
        timezone:
          type: string
        customerScope:
          type: string
          enum: [ALL, GENERAL, SPECIAL]
        orderWritable:
          type: boolean
        regions:
          type: array
          description: 当前生效综合客户白名单中实际使用的非空大区；空数组表示综合客户无需选择大区。
          items:
            type: object
            required: [code, name, sortNo]
            properties:
              code:
                $ref: '#/components/schemas/RegionCode'
              name:
                type: string
              sortNo:
                type: integer
        hasUnassignedGeneralCustomers:
          type: boolean
          description: 当前生效白名单是否存在未填写大区的综合客户；与非空 regions 同时存在时 H5 显示“不分大区”入口。
        whitelistCustomerTypeMode:
          type: string
          enum: [TYPED, UNSPECIFIED]
          description: 当前白名单客户类型模式；UNSPECIFIED 表示所有客户类型为空，H5 不显示通道和大区选择。
        availableCustomerTypes:
          type: array
          description: 当前白名单实际存在的有类型通道；UNSPECIFIED 模式下为空数组。
          items:
            type: string
            enum: [GENERAL, SPECIAL]
    ActivityInfoSnapshot:
      type: object
      required: [activityId, version, serverTime, heartbeatIntervalMs, activity]
      properties:
        activityId: { type: integer, format: int64 }
        version:
          type: string
          pattern: '^[0-9]+$'
          description: activity.public_info_version；使用字符串保留 BIGINT 精度，不作为事件续传游标。
        serverTime: { type: string, format: date-time }
        heartbeatIntervalMs: { type: integer, minimum: 1000, default: 30000 }
        activity: { $ref: '#/components/schemas/Activity' }
    PublicActivityResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/PublicActivity'
        traceId:
          type: string
    PhoneVerificationRequest:
      type: object
      required: [phone]
      properties:
        customerType:
          $ref: '#/components/schemas/CustomerType'
          description: 首次省略以自动识别；返回多身份时传 GENERAL 或 SPECIAL 确认。兼容明确传 ALL 的旧请求。
        regionCode:
          oneOf:
            - $ref: '#/components/schemas/RegionCode'
            - type: 'null'
          deprecated: true
          description: 旧请求兼容字段；登录不再要求或校验用户选择的大区，实际大区来自白名单身份。
        phone:
          type: string
          minLength: 1
          maxLength: 32
    PhoneVerificationResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [selectionRequired]
          properties:
            selectionRequired:
              type: boolean
              description: true 时只返回 customerTypes；false 时返回 customer 和 csrfToken。
            customerTypes:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [GENERAL, SPECIAL]
            csrfToken:
              type: string
            customer:
              type: object
              required: [sessionId, activityId, customerId, activityCode, customerType, phoneMasked]
              properties:
                sessionId:
                  type: integer
                  description: 兼容原登录返回值 0；真实会话以 HttpOnly Cookie 识别。
                activityId:
                  $ref: '#/components/schemas/Id'
                customerId:
                  $ref: '#/components/schemas/Id'
                activityCode:
                  type: string
                customerType:
                  $ref: '#/components/schemas/CustomerType'
                regionCode:
                  type: [string, 'null']
                branchName:
                  type: [string, 'null']
                dealerShortName:
                  type: [string, 'null']
                dealerFullName:
                  type: [string, 'null']
                phoneMasked:
                  type: string
        traceId:
          type: string
    ActivityCustomerSummary:
      type: object
      required: [id, customerType, dealerFullName, phoneMasked]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        customerType:
          $ref: '#/components/schemas/CustomerType'
        regionCode:
          oneOf:
            - $ref: '#/components/schemas/RegionCode'
            - type: 'null'
        branchName:
          type: [string, 'null']
        dealerShortName:
          type: [string, 'null']
        dealerFullName:
          type: string
        contactName:
          type: [string, 'null']
        phoneMasked:
          type: string
    ProductImage:
      type: object
      required: [url, primary, sortNo, sourceType, matchStatus]
      properties:
        url:
          type: string
          format: uri
        primary:
          type: boolean
        sortNo:
          type: integer
        sourceType:
          type: string
          enum: [ZIP_IMPORT, MANUAL]
          description: 图片内部来源，仅供管理逻辑使用，不作为商品列表状态展示。
        matchStatus:
          type: string
          enum: [MATCHED, PENDING, UNMATCHED, CONFIRMED]
    ProductImageReview:
      type: object
      required: [id, fileId, url, archivePath, materialName, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fileId:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          format: uri-reference
        archivePath:
          type: string
        materialCode:
          type: [string, 'null']
        materialName:
          type: string
        status:
          type: string
          enum: [PENDING]
    OrderableProduct:
      type: object
      required: [id, materialName, customerType, rebateStatus, giftBox, visible, orderable, sortNo, images, branchScope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        materialCode:
          type: [string, 'null']
        materialName:
          type: string
        description:
          type: [string, 'null']
          description: 商品说明，H5 商品详情展示；可为空
        categoryName:
          type: [string, 'null']
        productLine:
          type: [string, 'null']
        brandName:
          type: [string, 'null']
        varietyName:
          type: [string, 'null']
        specification:
          type: [string, 'null']
        casePack:
          type: [string, 'null']
        customerType:
          $ref: '#/components/schemas/ProductCustomerType'
        rebateStatus:
          $ref: '#/components/schemas/ProductRebateStatus'
        giftBox:
          type: boolean
        casePrice:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        priceTier:
          oneOf:
            - $ref: '#/components/schemas/ProductPriceTier'
            - type: 'null'
        tonCaseFactor:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        visible:
          type: boolean
        orderable:
          type: boolean
          description: 仅价格有效且商品可见时为 true；为 false 的商品仍可在 H5 展示“价格待完善”。
        branchScope:
          type: array
          description: 分公司定制品允许下单的分公司；空数组表示全部分公司可订。
          items:
            type: string
        sortNo:
          type: integer
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
    H5Product:
      type: object
      required: [id, materialName, customerType, rebateStatus, giftBox, visible, orderable, dataStatus, sortNo, version, images, branchScope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        materialCode:
          type: [string, 'null']
        materialName:
          type: string
        description:
          type: [string, 'null']
        categoryName:
