                $ref: '#/components/schemas/LotteryRoundResponse'
  /admin/activities/{activityId}/exports:
    get:
      operationId: listOrderExportTasks
      tags: [Exports]
      summary: 系统管理员查询本活动最近 20 条订单导出任务
      description: 仅整场活动已结束或已归档且未删除时可查询。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: 最近的导出任务
          content:
            application/json:
              schema:
                type: object
                properties:
                  traceId: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OrderExportTask' }
    post:
      operationId: createExportTask
      tags: [Exports]
      summary: 系统管理员创建异步订单 CSV ZIP 任务
      description: 仅 FINISHED、ARCHIVED 或按现有规则整场活动时间已结束且未删除的活动可创建。CLOSED 本身不足以开放导出。相同筛选和活动代次的未完成任务复用；请求键可重试。全局最多一个执行任务，队列默认最多 10 个未完成任务。四份 CSV 来自同一读取快照，文件保留 24 小时。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '202':
          description: 已创建或复用任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTaskResponse'
        '403':
          description: SUPER_ADMIN_REQUIRED
        '409':
          description: 活动未结束或幂等请求参数冲突
        '429':
          description: EXPORT_QUEUE_FULL
  /admin/activities/{activityId}/exports/{taskId}:
    get:
      operationId: getExportTask
      tags: [Exports]
      summary: 系统管理员查询订单导出进度
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 导出任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTaskResponse'
  /admin/activities/{activityId}/exports/{taskId}/cancel:
    post:
      operationId: cancelOrderExportTask
      tags: [Exports]
      summary: 系统管理员取消未完成的导出任务
      description: 取消运行中的任务后会等待文件操作停止，停止前仍阻止活动删除。允许在活动重新开放后取消。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 当前任务状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTaskResponse'
  /admin/activities/{activityId}/exports/{taskId}/download:
    get:
      operationId: downloadOrderExportPackage
      tags: [Exports]
      summary: 系统管理员下载已完成且未过期的订单 ZIP
      description: 校验当前管理员身份、活动结束状态、删除标记及活动重新开放代次。响应从对象存储流式读取；通用 public/files 路径不能读取导出文件。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 包含订单汇总、订单商品明细、有效商品汇总、有效分公司汇总四份 CSV，没有说明 TXT
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '409':
          description: 文件未完成、已过期或活动曾重新开放
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
