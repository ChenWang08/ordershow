openapi: 3.1.0
info:
  title: 订购会系统 API
  version: 1.0.0
  description: 多活动订购会系统的 H5、管理后台、现场大屏与抽奖接口契约。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
  - url: https://api.example.com/api/v1
    description: 正式环境占位域名
tags:
  - name: Public
  - name: H5
  - name: AdminAuth
  - name: Activities
  - name: Imports
  - name: Catalog
  - name: Customers
  - name: Orders
  - name: Dashboard
  - name: Lottery
  - name: Exports
  - name: Audit
paths:
  /public/activities/current:
    get:
      operationId: getCurrentOrderableActivity
      tags: [Public]
      summary: 查询当前唯一可下单活动
      description: 仅匹配已发布且当前时间位于开始和截止时间之间的活动；没有匹配返回 404，存在多个匹配返回 409。
      responses:
        '200':
          description: 当前可下单活动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicActivityResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /public/activities/{activityCode}:
    get:
      operationId: getPublicActivity
      tags: [Public]
      summary: 查询活动公开信息
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 活动公开信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicActivityResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /public/activities/{activityCode}/verify-phone:
    post:
      operationId: verifyActivityPhone
      tags: [Public]
      summary: 按活动、客户类型和手机号验证 H5 身份
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationRequest'
      responses:
        '200':
          description: 验证成功
          headers:
            Set-Cookie:
              description: 服务端设置的 Secure、HttpOnly、SameSite H5 会话 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerificationResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /h5/activities/{activityCode}/products:
    get:
      operationId: listH5OrderableProducts
      tags: [H5]
      summary: 查询当前客户可订商品
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: rebateStatus
          in: query
          schema:
            $ref: '#/components/schemas/RebateStatus'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 商品列表
          content:
            application/json:
              schema:
                type: object
                required: [data, traceId]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderableProduct'
                  traceId:
                    type: string
        '401':
          $ref: '#/components/responses/Problem'
  /h5/activities/{activityCode}/order:
    get:
      operationId: getH5CurrentOrder
      tags: [H5]
      summary: 查询本人当前订单
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 当前订单；未提交时 data 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrderResponse'
    put:
      operationId: submitH5Order
      tags: [H5]
      summary: 首次提交、修改或撤回后重新提交订单
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: 修改或重新提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrderResponse'
        '201':
          description: 首次提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrderResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /h5/activities/{activityCode}/order-draft:
    get:
      operationId: getH5OrderDraft
      tags: [H5]
      summary: 查询当前客户未提交的订单草稿
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 当前草稿；没有草稿时 data 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftResponse'
        '401':
          $ref: '#/components/responses/Problem'
    put:
      operationId: saveH5OrderDraft
      tags: [H5]
      summary: 自动保存当前客户订单草稿
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveOrderDraftRequest'
      responses:
        '200':
          description: 草稿已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftResponse'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteH5OrderDraft
      tags: [H5]
      summary: 删除当前客户订单草稿
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - $ref: '#/components/parameters/CsrfToken'
        - name: customerId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 草稿已删除或原本不存在
        '403':
          $ref: '#/components/responses/Problem'
  /h5/activities/{activityCode}/order/withdraw:
    post:
      operationId: withdrawH5Order
      tags: [H5]
      summary: 客户取消本次订货
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 撤回成功，明细和订单号保留
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrderResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/auth/login:
    post:
      operationId: loginAdmin
      tags: [AdminAuth]
      summary: 管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 64
                password:
                  type: string
                  format: password
                  maxLength: 200
      responses:
        '200':
          description: 登录成功并设置 HttpOnly Cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
        '401':
          $ref: '#/components/responses/Problem'
  /admin/auth/logout:
    post:
      operationId: logoutAdmin
      tags: [AdminAuth]
      summary: 撤销当前管理员会话
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已退出
  /admin/me:
    get:
      operationId: getCurrentAdmin
      tags: [AdminAuth]
      summary: 查询当前管理员
      security:
        - adminCookie: []
      responses:
        '200':
          description: 当前管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
  /admin/auth/change-password:
    post:
      operationId: changeAdminPassword
      tags: [AdminAuth]
      summary: 修改当前管理员密码并撤销其他会话
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 200
      responses:
        '204':
          description: 修改成功
        '400':
          $ref: '#/components/responses/Problem'
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [AdminAuth]
      summary: 管理员账号列表
      security:
        - adminCookie: []
      responses:
        '200':
          description: 管理员账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'
    post:
      operationId: createAdminUser
      tags: [AdminAuth]
      summary: 创建同角色管理员账号
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserWriteRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
  /admin/users/{adminUserId}:
    patch:
      operationId: updateAdminUser
      tags: [AdminAuth]
      summary: 修改、禁用或重置管理员密码
      security:
        - adminCookie: []
      parameters:
        - name: adminUserId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, changes]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                changes:
                  type: object
                  properties:
                    displayName:
                      type: string
                    status:
                      type: string
                      enum: [ACTIVE, DISABLED]
                    resetPassword:
                      type: boolean
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
  /admin/activities:
    get:
      operationId: listActivities
      tags: [Activities]
      summary: 活动列表
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActivityStatus'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 分页活动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPageResponse'
    post:
      operationId: createActivity
      tags: [Activities]
      summary: 创建活动
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityWriteRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
  /admin/activities/{activityId}:
    get:
      operationId: getActivity
      tags: [Activities]
      summary: 活动详情
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: 活动详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
    patch:
      operationId: updateActivity
      tags: [Activities]
      summary: 修改活动配置
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityWriteRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/publish:
    post:
      operationId: publishActivity
      tags: [Activities]
      summary: 发布草稿活动并进入待开始
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/withdraw-publication:
    post:
      operationId: withdrawActivityPublication
      tags: [Activities]
      summary: 将未开始活动撤回为草稿
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 撤回成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/close:
    post:
      operationId: closeActivityNow
      tags: [Activities]
      summary: 立即截止进行中的订货活动
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: 截止成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/finish:
    post:
      operationId: finishActivityNow
      tags: [Activities]
      summary: 结束整场活动并冻结抽奖、看板和战报
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: 整场活动结束成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/imports:
    get:
      operationId: listImportTasks
      tags: [Imports]
      summary: 导入任务列表
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 导入任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskPageResponse'
    post:
      operationId: createImportTask
      tags: [Imports]
      summary: 上传并解析导入文件
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [importType, file]
              properties:
                importType:
                  $ref: '#/components/schemas/ImportType'
                file:
                  type: string
                  format: binary
                auxiliaryFile:
                  type: string
                  format: binary
      responses:
        '202':
          description: 已创建解析任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskResponse'
  /admin/activities/{activityId}/imports/{taskId}:
    get:
      operationId: getImportTask
      tags: [Imports]
      summary: 导入任务详情和统计
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 导入任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskResponse'
  /admin/activities/{activityId}/imports/{taskId}/rows:
    get:
      operationId: listImportPreviewRows
      tags: [Imports]
      summary: 导入预览行
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: validationStatus
          in: query
          schema:
            type: string
            enum: [VALID, WARNING, BLOCKED]
      responses:
        '200':
          description: 预览行分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPageResponse'
    patch:
      operationId: deleteImportPreviewRows
      tags: [Imports]
      summary: 批量移除导入预览行并统一重新校验
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rowIds]
              properties:
                rowIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 所选预览行已在同一事务中移除并完成一次重新校验
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
  /admin/activities/{activityId}/imports/{taskId}/rows/{rowId}:
    patch:
      operationId: updateImportPreviewRow
      tags: [Imports]
      summary: 编辑导入预览行
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - name: rowId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: 重新校验后的预览行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
    delete:
      operationId: deleteImportPreviewRow
      tags: [Imports]
      summary: 从本次预览中删除异常行
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - name: rowId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已从预览移除
  /admin/activities/{activityId}/imports/{taskId}/attendance-match-preview:
    get:
      operationId: previewAttendanceWhitelistMatches
      tags: [Imports]
      summary: 按当前已发布白名单实时试算到场关联
      description: 读取当前到场 staging 有效行，先按参会人员类型限定客户通道，再按经销商全称和同分公司简称精确试算；现场手机号仅作联系信息，不参与客户身份关联。结果不写入正式到场版本；编辑或删除预览行、白名单版本变化后应重新调用。响应中的 whitelistVersionId 必须随确认请求提交，用于阻止按过期白名单结果发布。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 当前白名单版本下的实时关联试算结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceMatchPreviewResponse'
        '400':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/imports/{taskId}/errors:
    get:
      operationId: listImportErrors
      tags: [Imports]
      summary: 导入错误和警告明细
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 错误明细
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPageResponse'
  /admin/activities/{activityId}/imports/{taskId}/cancel:
    post:
      operationId: cancelImportTask
      tags: [Imports]
      summary: 取消尚未确认的导入任务
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskResponse'
  /admin/activities/{activityId}/imports/{taskId}/confirm:
    post:
      operationId: confirmImportTask
      tags: [Imports]
      summary: 确认导入并全量替换当前数据
      description: 商品导入可在确认时附带本批次图片 ZIP，并提交浏览器预览阶段形成的图片匹配决定。现场到场导入必须提交最近一次实时试算返回的白名单版本 ID。全部处理成功后才原子切换当前版本。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageZip:
                  type: string
                  format: binary
                  description: 仅商品导入可传；上传阶段只在浏览器预览，确认时才随任务保存
                imageDecisions:
                  type: string
                  description: 仅商品导入可传；JSON 数组。每项包含 ZIP 内 entryPath、CONFIRMED/PENDING/UNMATCHED 状态和 targetRowIds。CONFIRMED 与 PENDING 均须携带当前任务中的候选 staging 行，UNMATCHED 不得携带目标；一个物料代码最多确认一张图片，同代码的重复行共享。PENDING 会随商品版本发布并保留为后台待确认候选，不会作为 H5 商品图。
                attendanceWhitelistVersionId:
                  $ref: '#/components/schemas/Id'
                  description: 仅现场到场导入传入；必须等于最近一次关联试算返回的 whitelistVersionId。若当前无已发布白名单则不传。
      responses:
        '202':
          description: 已进入确认任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskResponse'
        '409':
          $ref: '#/components/responses/Problem'
