      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/RoundId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: 已重置且旧结果仍保留为失效记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotteryRoundResponse'
  /admin/activities/{activityId}/exports:
    post:
