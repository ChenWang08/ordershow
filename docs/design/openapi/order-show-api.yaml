          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
  /admin/activities/{activityId}/lottery/statistics:
    get:
      operationId: getLotteryStatistics
      tags: [Lottery]
      summary: 查询数据库当前有效中奖客户统计
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: 有效中奖记录、按白名单客户 ID 去重的有效中奖客户、已作废记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
  /admin/activities/{activityId}/lottery/rounds/{roundId}:
    patch:
      operationId: updateLotteryRound
      tags: [Lottery]
      summary: 修改尚未产生有效结果的轮次
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/RoundId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotteryRoundWriteRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotteryRoundResponse'
    delete:
      operationId: deleteLotteryRound
      tags: [Lottery]
      summary: 删除未执行的草稿轮次
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/RoundId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已删除草稿轮次
  /admin/activities/{activityId}/lottery/rounds/{roundId}/draw:
    post:
      operationId: drawLotteryRound
      tags: [Lottery]
      summary: 固定候选快照并产生中奖结果
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/RoundId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已持久化的结果；现场页可开始动画后揭晓
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotteryRoundResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/lottery/rounds/{roundId}/complete:
    post:
      operationId: completeLotteryRound
      tags: [Lottery]
      summary: 标记本轮展示完成
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/RoundId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 轮次完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotteryRoundResponse'
  /admin/activities/{activityId}/lottery/rounds/{roundId}/reset:
    post:
      operationId: resetLotteryRound
      tags: [Lottery]
      summary: 作废本轮旧结果并重置
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/RoundId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '200':
          description: 已重置且旧结果仍保留为失效记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotteryRoundResponse'
  /admin/activities/{activityId}/exports:
    post:
      operationId: createExportTask
      tags: [Exports]
      summary: 创建异步导出任务
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '202':
          description: 已创建任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTaskResponse'
  /admin/activities/{activityId}/exports/{taskId}:
    get:
      operationId: getExportTask
      tags: [Exports]
      summary: 查询导出任务和下载地址
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 导出任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTaskResponse'
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [Audit]
      summary: 审计日志列表
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: activityId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: actionCode
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPageResponse'
  /screen/activities/{activityCode}/ranking:
    get:
      operationId: getRankingDashboard
      tags: [Dashboard]
      summary: 排行榜快照
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: channel
          in: query
          required: true
          schema:
            type: string
            enum: [SPECIAL, GENERAL_EAST, GENERAL_SOUTH, GENERAL_NORTH_1, GENERAL_NORTH_2]
      responses:
        '200':
          description: 排行榜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /screen/activities/{activityCode}/dashboard:
    get:
      operationId: getOrderDashboard
      tags: [Dashboard]
      summary: 订单综合看板快照
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 订单总览、渠道产线对比、综合渠道片区产线明细、排行和小时趋势
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /screen/activities/{activityCode}/reports/{reportCode}:
    get:
      operationId: getTopicReport
      tags: [Dashboard]
      summary: 专题战报快照
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: reportCode
          in: path
          required: true
          schema:
            type: string
            enum: [SPECIAL_TOP5, GENERAL_TOP5, OVERALL, CHANNEL_TOTALS, GENERAL_REGION_TOTALS, GIFT_BOX_TOTALS, GENERAL_PRODUCT_LINES, ALL_PRODUCT_LINES, GENERAL_REGION_AND_LINES]
      responses:
        '200':
          description: 战报通用表格/指标快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /screen/activities/{activityCode}/lottery:
    get:
      operationId: getLotteryScreenState
      tags: [Lottery]
      summary: 现场抽奖只读状态和已保存结果
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 抽奖状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'
  /screen/activities/{activityCode}/events:
    get:
      operationId: subscribeScreenEvents
      tags: [Dashboard]
      summary: 活动大屏 SSE 事件流
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    h5Cookie:
      type: apiKey
      in: cookie
      name: ORDER_SHOW_H5_SESSION
      description: 默认同站点 H5 会话 Cookie；写请求还必须携带 X-CSRF-Token
    adminCookie:
      type: apiKey
      in: cookie
      name: ORDER_SHOW_ADMIN_SESSION
    screenToken:
      type: apiKey
      in: query
      name: screenToken
  parameters:
    ActivityCode:
      name: activityCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$'
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [20, 50, 100]
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        examples: ['"3"']
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: 统一错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      pattern: '^[1-9][0-9]*$'
      examples: ['123']
    Decimal:
      type: string
      pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
      examples: ['19457005.28']
    CustomerType:
      type: string
      enum: [GENERAL, SPECIAL]
    RegionCode:
      type: string
      minLength: 1
      maxLength: 64
      description: 活动内动态配置的大区代码，例如 EAST、SOUTH、NORTH；未来可增加 NORTH_1、NORTH_2。
    RebateStatus:
      type: string
      enum: [PARTICIPATING, NOT_PARTICIPATING]
    ActivityStatus:
      type: string
      enum: [DRAFT, SCHEDULED, ACTIVE, CLOSED, FINISHED, ARCHIVED]
    OrderStatus:
      type: string
      enum: [SUBMITTED, WITHDRAWN]
    ImportType:
      type: string
      enum: [PRODUCT, WHITELIST, ATTENDANCE, PRODUCT_IMAGE]
    ImportStatus:
      type: string
      enum: [UPLOADED, PARSING, PREVIEW_READY, CONFIRMING, MATERIALIZING, READY_TO_PUBLISH, PUBLISHING, COMPLETED, FAILED, CANCELLED]
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    PageMeta:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    GenericPageResponse:
      type: object
      required: [data, page, traceId]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          $ref: '#/components/schemas/PageMeta'
        traceId:
          type: string
    GenericListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        traceId:
          type: string
    SingleObjectResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          description: 排行数据中的吨数按有效订单当前明细的非空 line_tons 汇总；部分明细缺少转换系数时仍返回可计算合计，全部不可计算时为 null。
          additionalProperties: true
        traceId:
          type: string
    PublicActivity:
      type: object
      required: [code, name, status, startsAt, endsAt, eventEndsAt, timezone, customerScope]
      properties:
        code:
          type: string
          description: 面向运营人员展示的活动编号，用于数据识别、报表和兼容旧链接。
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ActivityStatus'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: 订货截止时间
        eventEndsAt:
          type: string
          format: date-time
          description: 整场活动结束时间；到时停止抽奖和实时推送，转为历史回看
        timezone:
          type: string
        customerScope:
          type: string
          enum: [ALL, GENERAL, SPECIAL]
        orderWritable:
          type: boolean
    PublicActivityResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          $ref: '#/components/schemas/PublicActivity'
        traceId:
          type: string
    PhoneVerificationRequest:
      type: object
      required: [customerType, phone]
      properties:
        customerType:
          $ref: '#/components/schemas/CustomerType'
        regionCode:
          oneOf:
            - $ref: '#/components/schemas/RegionCode'
            - type: 'null'
        phone:
          type: string
          minLength: 1
          maxLength: 32
    PhoneVerificationResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [csrfToken, expiresAt, customer, activity]
          properties:
            csrfToken:
              type: string
            expiresAt:
              type: string
              format: date-time
            customer:
              $ref: '#/components/schemas/ActivityCustomerSummary'
            activity:
              $ref: '#/components/schemas/PublicActivity'
        traceId:
          type: string
    ActivityCustomerSummary:
      type: object
      required: [id, customerType, dealerFullName, phoneMasked]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        customerType:
          $ref: '#/components/schemas/CustomerType'
        regionCode:
          oneOf:
            - $ref: '#/components/schemas/RegionCode'
            - type: 'null'
        branchName:
          type: [string, 'null']
        dealerShortName:
          type: [string, 'null']
        dealerFullName:
          type: string
        contactName:
          type: [string, 'null']
        phoneMasked:
          type: string
    ProductImage:
      type: object
      required: [url, primary, sortNo, sourceType, matchStatus]
      properties:
        url:
          type: string
          format: uri
        primary:
          type: boolean
        sortNo:
          type: integer
        sourceType:
          type: string
          enum: [ZIP_IMPORT, MANUAL]
          description: 图片内部来源，仅供管理逻辑使用，不作为商品列表状态展示。
        matchStatus:
          type: string
          enum: [MATCHED, PENDING, UNMATCHED, CONFIRMED]
    ProductImageReview:
      type: object
      required: [id, fileId, url, archivePath, materialCode, materialName, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fileId:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          format: uri-reference
        archivePath:
          type: string
        materialCode:
          type: string
        materialName:
          type: string
        status:
          type: string
          enum: [PENDING]
    OrderableProduct:
      type: object
      required: [id, materialName, customerType, rebateStatus, giftBox, visible, orderable, sortNo, images, branchScope]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        materialCode:
          type: [string, 'null']
        materialName:
          type: string
        categoryName:
          type: [string, 'null']
        productLine:
          type: [string, 'null']
        brandName:
          type: [string, 'null']
        varietyName:
          type: [string, 'null']
        specification:
          type: [string, 'null']
        casePack:
          type: [string, 'null']
        customerType:
          $ref: '#/components/schemas/CustomerType'
        rebateStatus:
          $ref: '#/components/schemas/RebateStatus'
        giftBox:
          type: boolean
        casePrice:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        tonCaseFactor:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        visible:
          type: boolean
        orderable:
          type: boolean
          description: 仅价格有效且商品可见时为 true；为 false 的商品仍可在 H5 展示“价格待完善”。
        branchScope:
          type: array
          description: 分公司定制品允许下单的分公司；空数组表示全部分公司可订。
          items:
            type: string
        sortNo:
          type: integer
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
    SubmitOrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999
    SubmitOrderRequest:
      type: object
      required: [expectedVersion, items]
      properties:
        expectedVersion:
          description: 未创建订单时传 0
          type: integer
          minimum: 0
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SubmitOrderItem'
    SaveOrderDraftRequest:
      type: object
      required: [customerId, baseOrderVersion, items]
      properties:
        customerId:
          $ref: '#/components/schemas/Id'
        baseOrderVersion:
          type: integer
          minimum: 0
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SubmitOrderItem'
    OrderDraft:
      type: object
      required: [id, activityId, customerId, baseOrderVersion, version, items, updatedAt, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        activityId:
          $ref: '#/components/schemas/Id'
        customerId:
          $ref: '#/components/schemas/Id'
        baseOrderVersion:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmitOrderItem'
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    OrderDraftResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/OrderDraft'
            - type: 'null'
        traceId:
          type: string
    OrderItem:
      type: object
      required: [lineNo, productId, materialName, quantity, casePrice, lineAmount]
      properties:
        lineNo:
          type: integer
        productId:
          $ref: '#/components/schemas/Id'
        materialCode:
          type: [string, 'null']
        materialName:
          type: string
        specification:
          type: [string, 'null']
        quantity:
          type: integer
          format: int64
        casePrice:
          $ref: '#/components/schemas/Decimal'
        lineAmount:
          $ref: '#/components/schemas/Decimal'
        tonCaseFactor:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        lineTons:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
    CurrentOrder:
      type: object
      required: [id, orderNo, status, currentVersion, totalQuantity, totalAmount, customer, items, firstSubmittedAt, lastSubmittedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        orderNo:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        currentVersion:
          type: integer
        writable:
          type: boolean
        totalQuantity:
          type: integer
          format: int64
        totalTons:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        totalAmount:
          $ref: '#/components/schemas/Decimal'
        customer:
          $ref: '#/components/schemas/ActivityCustomerSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        firstSubmittedAt:
          type: string
          format: date-time
        lastSubmittedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: [string, 'null']
          format: date-time
        withdrawnReason:
          type: [string, 'null']
    CurrentOrderResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/CurrentOrder'
            - type: 'null'
        traceId:
          type: string
    OrderVersionSummary:
      type: object
      required: [version, totalQuantity, totalAmount, submittedAt, submittedSource]
      properties:
        version:
          type: integer
        totalQuantity:
          type: integer
          format: int64
        totalTons:
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        totalAmount:
          $ref: '#/components/schemas/Decimal'
        submittedAt:
          type: string
          format: date-time
        submittedSource:
          type: string
          enum: [H5]
    AdminMeResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          required: [id, username, displayName, roleCode, mustChangePassword, csrfToken]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            username:
              type: string
            displayName:
              type: string
            roleCode:
              type: string
              enum: [ADMIN]
            mustChangePassword:
              type: boolean
            csrfToken:
              type: string
        traceId:
          type: string
    AdminUserWriteRequest:
      type: object
      required: [username, displayName, initialPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        initialPassword:
          type: string
          format: password
