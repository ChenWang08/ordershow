        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportRequest'
      responses:
        '202':
          description: 已创建任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTaskResponse'
  /admin/activities/{activityId}/exports/{taskId}:
    get:
      operationId: getExportTask
      tags: [Exports]
      summary: 查询导出任务和下载地址
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 导出任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportTaskResponse'
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [Audit]
      summary: 审计日志列表
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: activityId
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: actionCode
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPageResponse'
  /screen/activities/{activityCode}/ranking:
    get:
      operationId: getRankingDashboard
      tags: [Dashboard]
      summary: 排行榜快照
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: customerType
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, SPECIAL, GENERAL]
          description: 客户类型筛选；ALL 表示不限制客户类型，包含综合、特渠及系统内代表空客户类型的 ALL 订单。
        - name: regionCode
          in: query
          required: false
          description: 活动配置的动态片区编码；不分片区活动无需传入。
          schema:
            type: string
      responses:
        '200':
          description: 排行榜
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /screen/activities/{activityCode}/dashboard:
    get:
      operationId: getOrderDashboard
      tags: [Dashboard]
      summary: 订单综合看板快照
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 订单总览、渠道产线对比、动态综合渠道片区产线明细、排行和小时趋势；data.generalRegions 为自描述片区数组，空数组表示活动不分片区。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /screen/activities/{activityCode}/reports/{reportCode}:
    get:
      operationId: getTopicReport
      tags: [Dashboard]
      summary: 专题战报快照
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: reportCode
          in: path
          required: true
          schema:
            type: string
            enum: [SPECIAL_TOP5, GENERAL_TOP5, OVERALL, CHANNEL_TOTALS, GENERAL_REGION_TOTALS, GIFT_BOX_TOTALS, GENERAL_PRODUCT_LINES, ALL_PRODUCT_LINES, GENERAL_REGION_AND_LINES]
      responses:
        '200':
          description: 战报通用表格/指标快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
  /screen/activities/{activityCode}/lottery:
    get:
      operationId: getLotteryScreenState
      tags: [Lottery]
      summary: 现场抽奖只读状态和已保存结果
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 抽奖状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListResponse'
  /screen/activities/{activityCode}/events:
    get:
      operationId: subscribeScreenEvents
      tags: [Dashboard]
      summary: 活动大屏 SSE 事件流
      security:
        - screenToken: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: Last-Event-ID
          in: header
          description: 兼容接收但当前不提供事件续传；每次连接建立后应重新查询完整快照。
          schema:
            type: string
      responses:
        '200':
          description: connected/invalidate事件流。invalidate按活动合并，scope为ACTIVITY，eventCount为本批事件数，oldestEventAt为最早事件时间；version为本批最大ID而非可跳过迟提交事件的全局水位。eventType/aggregateId仅描述最后一条事件。客户端收到通知后刷新完整快照，允许重复通知。
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    h5Cookie:
      type: apiKey
      in: cookie
      name: ORDER_SHOW_H5_SESSION
      description: 默认同站点 H5 会话 Cookie；写请求还必须携带 X-CSRF-Token
    adminCookie:
      type: apiKey
      in: cookie
      name: ORDER_SHOW_ADMIN_SESSION
    screenToken:
      type: apiKey
      in: query
      name: screenToken
  parameters:
    ActivityCode:
      name: activityCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{2,63}$'
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [20, 50, 100]
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        examples: ['"3"']
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IncludeOrderHistory:
      name: includeHistory
      in: query
      description: 默认兼容返回全部历史；false只读取当前订单，versions与operations返回空数组。不会删除历史，管理员历史接口不受影响。
      schema:
        type: boolean
        default: true
  responses:
    Problem:
      description: 统一错误
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      pattern: '^[1-9][0-9]*$'
      examples: ['123']
    Decimal:
      type: string
      pattern: '^-?[0-9]+(?:\.[0-9]+)?$'
      examples: ['19457005.28']
    CustomerType:
      type: string
      enum: [GENERAL, SPECIAL, ALL]
      description: 白名单/身份使用的客户类型；ALL 表示白名单不区分综合或特渠，客户可直接输入手机号。
    ProductCustomerType:
      type: string
      enum: [GENERAL, SPECIAL, ALL]
      description: 商品适用客户类型；ALL 表示不区分综合或特渠。
    RegionCode:
      type: string
      minLength: 1
      maxLength: 64
      description: 根据当前综合客户白名单中的大区名称自动生成或复用的稳定内部代码。
    RebateStatus:
      type: string
      enum: [PARTICIPATING, NOT_PARTICIPATING]
    ProductRebateStatus:
      type: string
      enum: [PARTICIPATING, NOT_PARTICIPATING, ALL]
      description: 商品返利类型；ALL 表示不区分是否返利。
    ActivityStatus:
      type: string
      enum: [DRAFT, SCHEDULED, ACTIVE, CLOSED, FINISHED, ARCHIVED]
      description: 正常活动生命周期到 FINISHED 结束；ARCHIVED 仅为历史兼容状态，当前不提供活动归档接口。
    OrderStatus:
      type: string
      enum: [SUBMITTED, WITHDRAWN, VOIDED]
    ImportType:
      type: string
      enum: [PRODUCT, WHITELIST, ATTENDANCE, PRODUCT_IMAGE]
    ImportStatus:
      type: string
      enum: [UPLOADED, PARSING, PREVIEW_READY, CONFIRMING, MATERIALIZING, READY_TO_PUBLISH, PUBLISHING, COMPLETED, FAILED, CANCELLED]
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    PageMeta:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    GenericPageResponse:
      type: object
      required: [data, page, traceId]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        page:
          $ref: '#/components/schemas/PageMeta'
        traceId:
          type: string
    GenericListResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        traceId:
          type: string
    SingleObjectResponse:
      type: object
      required: [data, traceId]
      properties:
        data:
          type: object
          description: 排行数据中的吨数按有效订单当前明细的非空 line_tons 汇总；部分明细缺少转换系数时仍返回可计算合计，全部不可计算时为 null。
          additionalProperties: true
        traceId:
          type: string
    PublicActivity:
      type: object
      required: [code, name, status, startsAt, endsAt, eventEndsAt, timezone, customerScope]
      properties:
        code:
          type: string
          description: 面向运营人员展示的活动编号，用于数据识别、报表和兼容旧链接。
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ActivityStatus'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: 订货截止时间
        eventEndsAt:
          type: string
          format: date-time
          description: 整场活动结束时间；到时停止抽奖和实时推送，转为历史回看
        timezone:
          type: string
        customerScope:
          type: string
          enum: [ALL, GENERAL, SPECIAL]
        orderWritable:
          type: boolean
        regions:
          type: array
          description: 当前生效综合客户白名单中实际使用的非空大区；空数组表示综合客户无需选择大区。
          items:
            type: object
            required: [code, name, sortNo]
            properties:
              code:
                $ref: '#/components/schemas/RegionCode'
              name:
                type: string
              sortNo:
                type: integer
        hasUnassignedGeneralCustomers:
          type: boolean
          description: 当前生效白名单是否存在未填写大区的综合客户；与非空 regions 同时存在时 H5 显示“不分大区”入口。
        whitelistCustomerTypeMode:
          type: string
          enum: [TYPED, UNSPECIFIED]
          description: 当前白名单客户类型模式；UNSPECIFIED 表示所有客户类型为空，H5 不显示通道和大区选择。
        availableCustomerTypes:
          type: array
