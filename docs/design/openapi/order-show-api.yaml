    ProductPriceTier:
      type: object
      description: 商品多级阶梯价格。tiers包含从1箱起的独立第一档，开启后不使用普通casePrice。WHOLE_ORDER全部箱数使用最高已达档位；INCREMENTAL各段分别计费。旧minQuantity/casePrice返回第一优惠档，仅有第一档时返回该档。
      required: [minQuantity, casePrice, pricingMode, tiers]
      properties:
        minQuantity:
          type: integer
          format: int64
