      operationId: voidAdminOrder
      tags: [Orders]
      summary: 管理员作废订单
      description: 活动处于 ACTIVE、CLOSED 或 FINISHED 时可逻辑作废；不删除订单、明细、版本或操作记录。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVoidOrderRequest'
      responses:
        '200':
          description: 已作废，历史信息保留
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrderResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/orders/{orderId}/versions:
