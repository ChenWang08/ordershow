  /admin/activities/{activityId}/imports/{taskId}/confirm:
    post:
      operationId: confirmImportTask
      tags: [Imports]
      summary: 确认导入并全量替换当前数据
      description: 商品导入可在确认时附带本批次图片 ZIP，并提交浏览器预览阶段形成的图片匹配决定。现场到场导入必须提交最近一次实时试算返回的白名单版本 ID。全部处理成功后才原子切换当前版本。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageZip:
                  type: string
                  format: binary
                  description: 仅商品导入可传；上传阶段只在浏览器预览，确认时才随任务保存
                imageDecisions:
                  type: string
                  description: 仅商品导入可传；JSON 数组。每项包含 ZIP 内 entryPath、CONFIRMED/PENDING/UNMATCHED 状态和 targetRowIds。商品图片只按完整标准化物料名称匹配，物料代码不参与判重或图片匹配；商品名称中的 `/` 不是 ZIP 路径分隔符。CONFIRMED 与 PENDING 均须携带当前任务中的候选 staging 行，UNMATCHED 不得携带目标；一个商品名称最多确认一张图片，同名商品行共享，一张最终图片不能确认给多个不同名称。PENDING 会随商品版本发布并保留为后台待确认候选，不会作为 H5 商品图。
                attendanceWhitelistVersionId:
                  $ref: '#/components/schemas/Id'
                  description: 仅现场到场导入传入；必须等于最近一次关联试算返回的 whitelistVersionId。若当前无已发布白名单则不传。
      responses:
        '202':
          description: 已进入确认任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskResponse'
        '409':
          $ref: '#/components/responses/Problem'
