      type: object
      required: [minQuantity, casePrice]
      properties:
        minQuantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999
          description: 起始箱数，包含该箱；第一档固定为1，下一档起始前一箱为本档结束。兼容旧规则从优惠门槛起的数组。
        casePrice:
          $ref: '#/components/schemas/Decimal'
          description: 大于零且最多四位小数；第一档价格独立于普通箱价，后续档位低于上一档。
