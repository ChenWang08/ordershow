                $ref: '#/components/schemas/GenericPageResponse'
  /admin/activities/{activityId}/imports/{taskId}/cancel:
    post:
      operationId: cancelImportTask
      tags: [Imports]
      summary: 取消尚未确认的导入任务
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskResponse'
  /admin/activities/{activityId}/imports/{taskId}/confirm:
    post:
      operationId: confirmImportTask
      tags: [Imports]
      summary: 确认导入并全量替换当前数据
      description: 商品导入可在确认时附带本批次图片 ZIP，并提交浏览器预览阶段形成的图片匹配决定。现场到场导入必须提交最近一次实时试算返回的白名单版本 ID。全部处理成功后才原子切换当前版本。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageZip:
                  type: string
                  format: binary
                  description: 仅商品导入可传；上传阶段只在浏览器预览，确认时才随任务保存
                imageDecisions:
                  type: string
                  description: 仅商品导入可传；JSON 数组。每项包含 ZIP 内 entryPath、CONFIRMED/PENDING/UNMATCHED 状态和 targetRowIds。商品判重按客户类型、返利类型、标准化物料名称和物料代码规则执行；图片仍只按完整标准化物料名称匹配，物料代码不参与图片匹配，同名商品行共享图片。商品名称中的 `/` 不是 ZIP 路径分隔符。CONFIRMED 与 PENDING 均须携带当前任务中的候选 staging 行，UNMATCHED 不得携带目标；一个商品名称最多确认一张图片，同名商品行共享，一张最终图片不能确认给多个不同名称。PENDING 会随商品版本发布并保留为后台待确认候选，不会作为 H5 商品图。
                attendanceWhitelistVersionId:
                  $ref: '#/components/schemas/Id'
                  description: 仅现场到场导入传入；必须等于最近一次关联试算返回的 whitelistVersionId。若当前无已发布白名单则不传。
      responses:
        '202':
          description: 已进入确认任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTaskResponse'
        '409':
          $ref: '#/components/responses/Problem'
  /admin/activities/{activityId}/products:
    get:
      operationId: listActivityProducts
      tags: [Catalog]
      summary: 活动商品列表
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: customerType
          in: query
          schema:
            $ref: '#/components/schemas/CustomerType'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INCOMPLETE]
        - name: keyword
          in: query
          schema:
            type: string
        - name: activityCustomerId
          in: query
          description: 传入订单客户 ID 时，仅返回该客户当前可订的商品（客户类型、分公司范围和可订状态由服务端校验）。
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 商品分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericPageResponse'
    post:
      operationId: createActivityProduct
      tags: [Catalog]
      summary: 在当前已发布商品版本中手动新增单条商品
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [materialName]
              properties:
                materialName:
                  type: string
                description:
                  type: [string, 'null']
                  description: 商品说明，H5 商品详情展示；可为空
                branchScope:
                  type: string
                  description: 分公司限制，多个分公司用顿号或逗号分隔；留空表示全部分公司可订
                casePrice:
                  $ref: '#/components/schemas/Decimal'
                priceTiers:
                  type: array
                  maxItems: 101
                  description: 导入成功后手动设置的完整阶梯。第一档minQuantity=1、价格独立于普通casePrice，后续最多100档、起点递增且价格递减。旧数组不含第一档时以普通箱价补足。空数组表示不启用阶梯，Excel格式不增加字段。
                  items:
                    $ref: '#/components/schemas/ProductPriceStep'
                priceTierPricingMode:
                  type: string
                  enum: [WHOLE_ORDER, INCREMENTAL]
                  default: WHOLE_ORDER
                priceTierMinQuantity:
                  type: [integer, 'null']
                  description: 兼容旧单档请求；有 priceTiers 时以数组为准。
                priceTierCasePrice:
                  oneOf:
                    - $ref: '#/components/schemas/Decimal'
                    - type: 'null'
                reason:
                  type: string
                  maxLength: 500
                  description: 活动开始后修改商品时必填
              additionalProperties: true
      responses:
        '200':
          description: 新增后的商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
  /admin/activities/{activityId}/products/{productId}:
    patch:
      operationId: updateActivityProduct
      tags: [Catalog]
      summary: 紧急修改单条商品
      description: 请求字段直接放在顶层。价格变化时同步更新本活动该商品的有效订单及统计，完成后才返回成功；任一步失败整体回滚。同活动下单可能等待该保存事务结束。H5 不轮询商品价格，提交时使用服务器最新规则。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - name: productId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: 活动开始后商品编辑器必填；下单范围等修改由服务端校验。
                description:
                  type: [string, 'null']
                  description: 商品说明，H5 商品详情展示；传空字符串清除，省略保持原值。
                branchScope:
                  type: string
                  description: 分公司限制，多个分公司用顿号或逗号分隔；留空表示全部分公司可订
                casePrice:
                  oneOf:
                    - $ref: '#/components/schemas/Decimal'
                    - type: 'null'
                casePriceSet:
                  type: boolean
                  description: true时更新普通箱价；false或省略时保留。已开启独立阶梯时不修改第一档，也不触发订单重算。
                priceTiers:
                  type: array
                  maxItems: 101
                  description: 完整替换包含独立第一档的阶梯，省略时保留现有规则，空数组清除并恢复普通箱价。第一档minQuantity=1，后续起点递增且价格递减，所有档位共用一种模式。兼容不含第一档的旧数组。
                  items:
                    $ref: '#/components/schemas/ProductPriceStep'
                priceTierPricingMode:
                  type: string
                  enum: [WHOLE_ORDER, INCREMENTAL]
                  default: WHOLE_ORDER
                  description: 替换档位时使用；更改模式需同时提交完整 priceTiers。
                priceTierSet:
                  type: boolean
                  description: 兼容旧单档更新标识；true 且未传数组时使用旧门槛/价格，两项均空时清除。传入 priceTiers 时无需该标识。
                priceTierMinQuantity:
                  type: [integer, 'null']
                  minimum: 2
                  maximum: 999999
                  description: 旧单档起始箱数；有 priceTiers 时以数组为准。
                priceTierCasePrice:
                  oneOf:
                    - $ref: '#/components/schemas/Decimal'
                    - type: 'null'
              additionalProperties: true
      responses:
        '200':
          description: 修改后的商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
    delete:
      operationId: deleteActivityProduct
      tags: [Catalog]
      summary: 从当前活动商品目录删除单条商品
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - name: productId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已从当前商品目录删除；历史订单不受影响
  /admin/activities/{activityId}/products/{productId}/editor-state:
    get:
      operationId: getProductEditorState
