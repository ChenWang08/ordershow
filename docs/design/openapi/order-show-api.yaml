openapi: 3.1.0
info:
  title: 订购会系统 API
  version: 1.0.0
  description: 多活动订购会系统的 H5、管理后台、现场大屏与抽奖接口契约。时间字段统一以 UTC ISO 8601（带 Z）传输；业务页面、活动时间输入及 Excel 按北京时间（Asia/Shanghai）处理。历史混用时区的数据需单独核对修正。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
  - url: https://api.example.com/api/v1
    description: 正式环境占位域名
tags:
  - name: Public
  - name: H5
  - name: AdminAuth
  - name: Activities
  - name: Imports
  - name: Catalog
  - name: Customers
  - name: Orders
  - name: Dashboard
  - name: Lottery
  - name: Exports
  - name: Audit
paths:
  /public/files/{fileId}/thumbnail:
    get:
      operationId: getImageThumbnail
      tags: [Public]
      summary: 获取图片缩略图（长边不超过 320px）
      description: 仅商品、奖品、活动背景图片可访问；保持比例且不放大小图。上传时生成，历史文件首次读取时补齐并持久保存。替换上传产生新 fileId；前端使用 v=1 版本地址，公开缓存 30 天并支持 ETag/304。失败不返回原图。
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: JPEG 或保留透明背景的 PNG
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '304': { description: 内容未变化，无正文 }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /public/files/{fileId}/display:
    get:
      operationId: getImageDisplay
      tags: [Public]
      summary: 获取较大展示图（长边不超过 960px）
      description: 用于抽奖大屏奖品展示；保持比例、不放大小图，文件用途限制、版本地址、缓存和错误规则与缩略图相同。
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: JPEG 或保留透明背景的 PNG
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '304': { description: 内容未变化，无正文 }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /admin/activities/{activityId}/backgrounds/{kind}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [h5, desktop] }
    post:
      operationId: uploadActivityBackground
      tags: [Activities]
      summary: 管理员上传并立即保存活动背景
      description: JPG/JPEG、PNG、WebP；h5 上限 5 MiB，desktop 上限 10 MiB。电脑端订单排行、专题战报、幸运抽奖共用。校验管理员及活动所属部门；仅更新所选背景，不修改活动基础配置版本。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: 背景已保存，返回更新后的活动
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
                  traceId: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: resetActivityBackground
      tags: [Activities]
      summary: 清除当前活动所选背景，恢复各页面默认背景
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已恢复默认
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Activity' }
                  traceId: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/members:
    get:
      operationId: listDepartmentMembers
      tags: [AdminAuth]
      summary: 管理员查询成员；部门管理员强制限定本部门
      security:
        - adminCookie: []
      parameters:
        - name: departmentId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DepartmentMember' }
                  traceId: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDepartmentMember
      tags: [AdminAuth]
      summary: 创建独立成员账号，默认无模块权限
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCreate' }
      responses:
        '200':
          description: 成员已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberResponse' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/members/{id}:
    patch:
      operationId: updateDepartmentMember
      tags: [AdminAuth]
      summary: 编辑成员、替换权限、启停或重置密码
      description: 仅管理员可操作。部门管理员只能管理本部门成员。权限提交后后续请求立即生效；停用或重置密码撤销全部已有会话。姓名可修改，用户名、角色及部门不可修改。
      security:
        - adminCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdate' }
      responses:
        '200':
          description: 成员已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberResponse' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/activities/{activityId}/module-context:
    get:
      operationId: getModuleContext
      tags: [Activities]
      summary: 模块辅助计数与客户类型模式，不包含客户个人信息
      description: 至少具有一项模块权限；部门范围由后端检查。
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: 业务辅助信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      customerCount: { type: integer }
                      customersByType: { type: object, additionalProperties: { type: integer } }
                      customerTypeMode: { type: string, enum: [TYPED, UNSPECIFIED] }
                      attendeeCount: { type: integer }
                      whitelistPublished: { type: boolean }
                  traceId: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/activities/{activityId}/orders/customer-options:
    get:
      operationId: searchOrderCustomerOptions
      tags: [Orders]
      summary: 订单编辑所需的客户查询，仅需 ORDER 权限
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - name: keyword
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        '200':
          description: 分页客户选择数据，与客户列表格式一致，不开放白名单写入权限
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/activities/{activityId}/orders/product-options:
    get:
      operationId: listOrderProductOptions
      tags: [Orders]
      summary: 订单编辑所需的商品查询，仅需 ORDER 权限
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - name: activityCustomerId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 商品选择数据，与商品列表格式一致，不开放商品写入权限
          content:
            application/json:
              schema: { type: object }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/activities/{activityId}/overview:
    get:
      operationId: getAdminActivityOverview
      tags: [AdminAuth]
      summary: 活动概览专用统计与提交进度
      description: 需要本活动部门访问权限及 OVERVIEW 模块权限。概览只调用此接口；活动统计与当前有效发布白名单人数在同一事务视图读取。历史活动沿用既有冻结统计口径。
      security:
        - adminCookie: []
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 概览统计，不包含排行、项目组、趋势或到场名单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityOverviewResponse'
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/activities/{activityId}/ranking:
    get:
      operationId: getAdminActivityRanking
      tags: [AdminAuth]
      summary: 旧版后台排行兼容接口（概览已改用 overview）
      security:
        - adminCookie: []
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: customerType
          in: query
          schema:
            type: string
        - name: metric
          in: query
          schema:
            type: string
            enum: [AMOUNT, TONS]
            default: AMOUNT
      responses:
        '200':
          description: 活动统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '404':
          $ref: '#/components/responses/Problem'
  /public/activities/current:
    get:
      operationId: getCurrentOrderableActivity
      tags: [Public]
      summary: 查询当前唯一可下单活动
      description: 仅匹配已发布且当前时间位于开始和截止时间之间的活动；没有匹配返回 404，存在多个匹配返回 409。
      responses:
        '200':
          description: 当前可下单活动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicActivityResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /public/activities/{activityCode}:
    get:
      operationId: getPublicActivity
      tags: [Public]
      summary: 普通 HTTP 读取活动资料及条件检查
      security: []
      description: |
        H5、看板、排行、战报和抽奖页面首次读取完整 JSON。携带上次 ETag 的 If-None-Match 检查，
        未变化返回无正文的 304，变化返回完整资料。弱 ETag 包含公开版本及时间派生状态。
        版本检查每副本短缓存默认 2 秒；完整资料按版本/状态缓存，同活动并发合并，等待不占数据库连接。
        页面可见时约每 30 秒随机错开检查，隐藏暂停、恢复可见立即检查；不会自动刷新订单或统计。
        Cache-Control 为 private, no-cache。服务器对下单和开奖仍实时校验，不使用浏览器资料作授权依据。
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: 完整活动资料
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicActivityResponse'
        '304':
          description: 资料未变化，无正文；ETag 与 Cache-Control 保留
          headers:
            ETag:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /public/activities/{activityCode}/events:
    get:
      operationId: subscribePublicActivityInfo
      tags: [Public]
      summary: 旧客户端兼容活动资料 SSE（新前端停用）
      security: []
      description: |
        手机验证前后及公开展示页面共用。建立连接后发送当前 activity 快照；活动资料变化后直接发送最新快照，
        不通知客户端重查接口。只包含现有公开活动资料，不包含订单、审核、商品目录、客户身份或统计数据。
        本接口仅保留旧客户端兼容。新前端首次加载与约 30 秒检查均使用普通 GET，不建立活动 SSE。
        默认每 30 秒发送 heartbeat，心跳不查数据库。断线后退避重连，每次新连接重新同步当前资料，
        不提供 Last-Event-ID 历史续传。CLOSED/FINISHED 仍可订阅以感知重新开放；活动不存在时发送 unavailable 后结束。
        服务端返回 Cache-Control: no-cache, no-transform 与 X-Accel-Buffering: no；代理须关闭缓冲并允许长连接。
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: |
            text/event-stream。activity 的 data 为 ActivityInfoSnapshot；heartbeat 的 data 包含 serverTime、heartbeatIntervalMs；
            unavailable 的 data 包含 code、message，随后结束连接。version 是独立公开资料版本的十进制字符串，
            与后台保存版本和订单事件编号无关。允许重复快照；同版本只允许较新 serverTime 推进时间派生状态。
          content:
            text/event-stream:
              schema: { type: string }
              example: "event: heartbeat\ndata: {\"serverTime\":\"2026-10-31T01:00:00Z\",\"heartbeatIntervalMs\":30000}\n\n"
        '503': { $ref: '#/components/responses/Problem' }
  /public/activities/{activityCode}/verify-phone:
    post:
      operationId: verifyActivityPhone
      tags: [Public]
      summary: 手机号识别 H5 身份，多类型同号时选择后登录
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationRequest'
      responses:
        '200':
          description: 唯一身份登录成功，或返回待选择的综合/特渠类型（待选择时不创建会话、不设置登录 Cookie）
          headers:
            Set-Cookie:
              description: 服务端设置的 Secure、HttpOnly、SameSite H5 会话 Cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerificationResponse'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /public/activities/{activityCode}/lottery:
    get:
      operationId: getPublicLottery
      tags: [Public, Lottery]
      summary: 读取公开抽奖规则与中奖结果
      description: 仅抽奖页面打开且活动资料就绪后按需读取；H5 订货初始化不调用本接口。
      security: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 已发布规则及公开中奖结果；不计算候选名单
          content:
            application/json:
              schema:
                type: object
                required: [data, traceId]
                properties:
                  data:
                    type: object
                    required: [rules, winners]
                    properties:
                      rules: { type: array, items: { type: object } }
                      winners: { type: array, items: { type: object } }
                  traceId: { type: string }
        '404': { $ref: '#/components/responses/Problem' }
  /h5/activities/{activityCode}/products:
    get:
      operationId: listH5OrderableProducts
      tags: [H5]
      summary: 查询当前客户可订商品
      description: 每次核对当前客户与目录版本，共用活动商品缓存后按客户权限过滤；响应为 H5 精简结构。商品加载时机不变，不新增商品推送或轮询。
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - name: rebateStatus
          in: query
          schema:
            $ref: '#/components/schemas/RebateStatus'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: 当前客户可见的商品列表（Cache-Control 为 private, no-store）
          content:
            application/json:
              schema:
                type: object
                required: [data, traceId]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/H5Product'
                  traceId:
                    type: string
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          description: 商品加载并发、等待人数超限或等待超时（CATALOG_BUSY），保留当前页面数据后重试
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /h5/activities/{activityCode}/order:
    get:
      operationId: getH5CurrentOrder
      tags: [H5]
      summary: 查询本人当前订单
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - $ref: '#/components/parameters/IncludeOrderHistory'
      responses:
        '200':
          description: 当前订单；未提交时 data 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrderResponse'
    put:
      operationId: submitH5Order
      tags: [H5]
      summary: 首次提交、纯增量更新或失效订单恢复
      description: 有效订单减少或删除任一商品返回 ORDER_CHANGE_REVIEW_REQUIRED，须改用审核申请接口；纯增量直接生效，已撤回或已作废订单直接恢复，无变化不新增版本。同次网络异常、超时或503重试必须复用原Idempotency-Key、expectedVersion、expectedLockVersion（如有）、items及includeHistory。指纹忽略JSON属性及商品列表顺序。成功重放返回首次订单版本响应快照且无写副作用；同键异载荷返回IDEMPOTENCY_KEY_REUSED。历史记录缺失快照返回IDEMPOTENCY_RESULT_UNAVAILABLE，应查询订单。
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IncludeOrderHistory'
        - name: X-H5-Customer-Id
          in: header
          required: false
          description: 新版H5发送本次提交绑定的客户ID；与会话客户不一致时返回403 H5_CUSTOMER_CHANGED。兼容历史客户端省略。
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '200':
          description: 首次提交、修改、重新提交成功，或回放首次成功快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentOrderResponse'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          description: 写入准入等待超时，本次请求未进入订单业务处理；可使用原键重试
          headers:
            Retry-After:
              schema:
                type: string
              description: 重试前至少等待的秒数
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum: [H5_WRITE_BUSY]
                  message:
                    type: string
  /h5/activities/{activityCode}/order-draft:
    get:
      operationId: getH5OrderDraft
      tags: [H5]
      summary: 查询当前客户未提交的订单草稿
      security:
        - h5Cookie: []
      parameters:
        - $ref: '#/components/parameters/ActivityCode'
      responses:
        '200':
          description: 当前草稿；没有草稿时 data 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftResponse'
        '401':
          $ref: '#/components/responses/Problem'
    put:
