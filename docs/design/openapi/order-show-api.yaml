        - $ref: '#/components/parameters/RoundId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 轮次完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotteryRoundResponse'
  /admin/activities/{activityId}/lottery/rounds/{roundId}/reset:
    post:
      operationId: resetLotteryRound
