                  minimum: 0
                  description: 规则列表返回的 revision；版本过期返回409，不覆盖新顺序
                roundIds:
                  type: array
                  description: 与 rounds 一一对应；既有轮次填原ID，新增轮次填null，排序须使用独立接口
                  items:
                    type: [integer, 'null']
                rounds:
                  type: array
                  minItems: 1
                  items:
                    type: object
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleObjectResponse'
  /admin/activities/{activityId}/lottery/rules/{ruleId}/round-order:
