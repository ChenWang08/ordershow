name: order-show

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_show
      MYSQL_USER: order_show
      MYSQL_PASSWORD: ${DB_PASSWORD:-order_show_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-order_show_root_local}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - order-show-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uorder_show -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - order-show-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-order_show_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-order_show_minio_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - order-show-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_show?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
      DB_USERNAME: order_show
      DB_PASSWORD: ${DB_PASSWORD:-order_show_local}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-60}
      HTTP_MAX_THREADS: ${HTTP_MAX_THREADS:-60}
      H5_WARMUP_ENABLED: ${H5_WARMUP_ENABLED:-true}
      H5_WRITE_CONCURRENCY: ${H5_WRITE_CONCURRENCY:-36}
      DASHBOARD_SUMMARY_ENABLED: ${DASHBOARD_SUMMARY_ENABLED:-false}
      VIRTUAL_THREADS_ENABLED: ${VIRTUAL_THREADS_ENABLED:-true}
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-order_show_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-order_show_minio_2026}
      S3_BUCKET: order-show
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      PHONE_HMAC_KEY: ${PHONE_HMAC_KEY:-local-change-this-phone-hmac-key-before-production}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:-local-change-this-phone-encryption-key-before-production}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  order-show-mysql:
  order-show-redis:
  order-show-minio:
