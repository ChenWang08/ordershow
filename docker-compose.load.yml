name: order-show-load
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: order_show_load
      MYSQL_USER: order_show_load
      MYSQL_PASSWORD: load_only_password
      MYSQL_ROOT_PASSWORD: load_only_root
    command: ["--slow-query-log=ON", "--long-query-time=0.2"]
    volumes: ["load-mysql:/var/lib/mysql"]
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uorder_show_load -p$$MYSQL_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7.4-alpine
    mem_limit: 128m
    cpus: 0.5
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: load_only_minio
      MINIO_ROOT_PASSWORD: load_only_minio_password
    volumes: ["load-minio:/data"]
    mem_limit: 256m
    cpus: 0.5
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${LOAD_BACKEND_IMAGE:-order-show-load-backend}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_show_load?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: order_show_load
      DB_PASSWORD: load_only_password
      DB_POOL_SIZE: ${LOAD_DB_POOL_SIZE:-20}
      DASHBOARD_SUMMARY_ENABLED: ${LOAD_DASHBOARD_SUMMARY_ENABLED:-false}
      DASHBOARD_SUMMARY_ACTIVITIES: ${LOAD_DASHBOARD_SUMMARY_ACTIVITIES:-}
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: load_only_minio
      S3_SECRET_KEY: load_only_minio_password
      S3_BUCKET: order-show-load
      PUBLIC_ORIGIN: http://localhost:3200
      COOKIE_SECURE: "false"
      PHONE_HMAC_KEY: load-only-hmac
      PHONE_ENCRYPTION_KEY: load-only-encryption
      BOOTSTRAP_ADMIN_USERNAME: load_admin
      BOOTSTRAP_ADMIN_PASSWORD: LoadOnlyPassword123!
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m
      SERVER_TOMCAT_THREADS_MAX: ${LOAD_HTTP_MAX_THREADS:-40}
      H5_WARMUP_ENABLED: ${LOAD_H5_WARMUP_ENABLED:-true}
      H5_WRITE_CONCURRENCY: ${LOAD_H5_WRITE_CONCURRENCY:-12}
      VIRTUAL_THREADS_ENABLED: ${LOAD_VIRTUAL_THREADS_ENABLED:-true}
    ports: ["127.0.0.1:${LOAD_BACKEND_PORT:-8280}:8080"]
    mem_limit: 1280m
    cpus: 2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
  k6:
    image: grafana/k6:1.6.0
    profiles: ["tools"]
    volumes:
      - ./tests/load:/scripts:ro
      - ${LOAD_RESULTS_ROOT:-./outputs/load}:/results
    mem_limit: 1g
    cpus: 2
    entrypoint: ["k6"]
volumes:
  load-mysql:
  load-minio:
